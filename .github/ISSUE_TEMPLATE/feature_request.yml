name: 💡 Feature Request
description: Suggest an idea or enhancement for ChatMe
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        We appreciate your ideas and suggestions to make ChatMe even better!

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific problem or pain point?
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Feature Description
      description: Describe what you would like to see added or changed.
      placeholder: It would be awesome if ChatMe could...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions, mockups, or features you've considered.

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any relevant screenshots, API docs, or references.
